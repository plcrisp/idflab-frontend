<div class="w-full min-w-0 flex flex-col justify-between">
  <!-- Cabeçalho Discreto do Gráfico -->
  <div class="flex items-center justify-between h-7 mb-2">
    <div class="flex items-center gap-2 min-w-0">
      <h4 class="text-sm font-medium text-foreground shrink-0">
        Curva de dupla massa
      </h4>
      <span class="text-xs text-muted-foreground truncate hidden sm:inline">
        · Y: {{ principalStationName() | titlecase }}
      </span>
    </div>
  </div>

  <!-- Área do Gráfico ou Skeleton de Carregamento -->
  <div class="chart-area relative w-full">
    @if (loading()) {
      <div class="absolute inset-0 flex flex-col justify-between p-3 bg-muted/10 rounded-lg border border-border/40 animate-pulse z-10">
        <div class="flex justify-between">
          <div hlmSkeleton class="h-3.5 w-28 rounded"></div>
          <div hlmSkeleton class="h-3.5 w-36 rounded"></div>
        </div>
        <div class="flex-1 flex items-center justify-center py-2">
          <div hlmSkeleton class="h-44 w-full rounded"></div>
        </div>
        <div class="flex justify-between">
          <div hlmSkeleton class="h-2.5 w-20 rounded"></div>
          <div hlmSkeleton class="h-2.5 w-20 rounded"></div>
        </div>
      </div>
    }

    <div
      #chartContainer
      class="chart-container"
      [class.invisible]="loading()"
    ></div>
  </div>

  <!-- Legenda curta de eixos -->
  <p class="text-[11px] text-muted-foreground mt-2 pt-1.5 border-t border-border/40">
    Eixos: precipitação acumulada no período de registro comum (mm).
  </p>
</div>
