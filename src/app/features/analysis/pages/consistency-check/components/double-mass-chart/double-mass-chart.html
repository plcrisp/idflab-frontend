<div class="h-full w-full min-w-0 flex flex-col justify-between">
  <!-- Cabeçalho do Gráfico -->
  <div class="flex items-center justify-between pb-1 mb-0.5">
    <div class="flex items-center gap-2 min-w-0">
      <h3 class="text-xs sm:text-sm font-semibold uppercase tracking-wide text-foreground shrink-0">
        Curva de Dupla Massa
      </h3>
      <span class="text-xs text-muted-foreground truncate hidden sm:inline">
        · Y: {{ principalStationName() | titlecase }}
      </span>
    </div>
  </div>

  <!-- Área do Gráfico ou Skeleton de Carregamento -->
  <div class="relative flex-1 h-56 sm:h-64 min-h-55 w-full">
    @if (loading()) {
      <div class="absolute inset-0 flex flex-col justify-between p-3 bg-muted/10 rounded-lg border border-border/40 animate-pulse">
        <div class="flex justify-between">
          <div hlmSkeleton class="h-3.5 w-28 rounded"></div>
          <div hlmSkeleton class="h-3.5 w-36 rounded"></div>
        </div>
        <div class="flex-1 flex items-center justify-center py-2">
          <div hlmSkeleton class="h-32 w-full rounded"></div>
        </div>
        <div class="flex justify-between">
          <div hlmSkeleton class="h-2.5 w-20 rounded"></div>
          <div hlmSkeleton class="h-2.5 w-20 rounded"></div>
        </div>
      </div>
    }

    <div
      #chartContainer
      class="w-full h-full"
      [class.invisible]="loading()"
    ></div>
  </div>

  <!-- Legenda curta de eixos -->
  <p class="text-[11px] text-muted-foreground mt-1.5 pt-1 border-t border-border/40">
    Eixos: precipitação acumulada no período de registro comum (mm).
  </p>
</div>
