<div class="consistency-analysis-wrapper w-full">
  @if (error(); as err) {
    <!-- Estado de Erro -->
    <div class="flex items-center gap-2.5 text-xs text-destructive p-3.5 rounded-xl border border-destructive/20 bg-destructive/5">
      <ng-icon name="lucideTriangleAlert" class="text-base shrink-0" />
      <span>{{ err }}</span>
    </div>
  } @else {
    <!-- Layout em Duas Colunas: Gráfico de Dupla Massa (~65%) e Indicadores Pearson/Cobertura (~35%) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 items-stretch">
      <!-- Coluna Esquerda: Gráfico de Dupla Massa (~65%) -->
      <div class="lg:col-span-8 flex flex-col pb-5 lg:pb-0 lg:pr-6">
        <app-double-mass-chart
          [points]="analysis()?.double_mass?.points ?? []"
          [principalStationName]="principalStationName() | titlecase"
          [neighborStationName]="neighborStationName() | titlecase"
          [loading]="isLoading()"
        />
      </div>

      <!-- Coluna Direita: Indicadores de Consistência (~35%) -->
      <div class="lg:col-span-4 flex flex-col justify-between pt-5 lg:pt-0 lg:pl-6 border-t lg:border-t-0 lg:border-l border-border">
        <!-- Cabeçalho com Título Rebaixado Alinhado à Dupla Massa -->
        <div class="flex items-center justify-between h-7 mb-2">
          <h4 class="text-sm font-medium text-foreground">
            Indicadores
          </h4>
        </div>

        <!-- Indicadores em Layout Wide Distribuídos Uniformemente -->
        <div class="flex flex-col justify-between flex-1 gap-3 py-1">
          <!-- Card 1: Correlação de Pearson -->
          <app-stat-card
            variant="plain"
            layout="wide"
            label="Correlação de Pearson"
            icon="lucideTrendingUp"
            [iconVariant]="pearsonVariant()"
            [value]="pearsonValueFormatted()"
            [footer]="pearsonFooter()"
            [loading]="isLoading()"
          />

          <!-- Divisória Sutil Interna -->
          <div class="border-t border-border/40 w-full my-0.5"></div>

          <!-- Card 2: Cobertura Preenchível -->
          <app-stat-card
            variant="plain"
            layout="wide"
            label="Cobertura preenchível"
            icon="lucideShieldCheck"
            [iconVariant]="coverageVariant()"
            [value]="coverageValueFormatted()"
            [footer]="coverageFooter()"
            [loading]="isLoading()"
          />
        </div>
      </div>
    </div>
  }
</div>
