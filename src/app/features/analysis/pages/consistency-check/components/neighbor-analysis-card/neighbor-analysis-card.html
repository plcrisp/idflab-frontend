<div
  id="neighbor-analysis-card"
  class="w-full min-w-0 flex flex-col rounded-xl shadow-sm border border-border bg-popover text-foreground overflow-hidden"
>
  <!-- Cabeçalho do Card -->
  @if (targetStation(); as station) {
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-border px-4 py-3">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="text-sm font-semibold uppercase tracking-wide text-foreground">
          Análise de Consistência
        </h3>
        <span class="text-sm font-normal text-muted-foreground">
          · {{ station.name | titlecase }}
        </span>

        <!-- Badge Colorido com Source -->
        <span
          hlmBadge
          [ngClass]="station.source.toLowerCase()"
          class="flex items-center gap-1.5 border-none font-medium text-xs px-2 py-0.5 rounded-md shrink-0"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
          {{ station.source }}
        </span>

        <!-- Chip de Distância com Ícone -->
        <span class="inline-flex items-center gap-1.5 text-xs font-medium text-foreground bg-secondary/80 px-2.5 py-0.5 rounded-md border border-border shrink-0">
          <ng-icon name="lucideMapPin" class="text-xs text-primary shrink-0" />
          <span>{{ formatDistance(station.distance_km) }}</span>
        </span>
      </div>

      <!-- Ação à Direita: Botão Trocar de Estação -->
      <button
        hlmBtn
        variant="outline"
        size="sm"
        [disabled]="isSelectionLocked()"
        (click)="onChangeStation()"
        class="cursor-pointer font-medium inline-flex items-center gap-1.5 shadow-xs transition-all shrink-0"
      >
        <span>Trocar de estação</span>
        <ng-icon name="lucideArrowUp" class="text-xs" />
      </button>
    </div>
  }

  <!-- Corpo do Card -->
  <div class="p-4">
    @if (status() === 'loading') {
      <div #loadingContainer class="analysis-loading-wrapper w-full flex flex-col">
        <app-job-progress-card
          variant="full"
          [job]="job()"
          [customTitle]="targetStation()?.name ? (targetStation()!.name | titlecase) : 'Estação Vizinha'"
          [customSource]="targetStation()?.source ?? null"
          [customDescription]="'Busca e processamento dos dados da estação em andamento.'"
          [customMessage]="!job() ? (progress()?.message ?? null) : null"
          [customProgress]="!job() ? (progress()?.percentage ?? null) : null"
          class="block [&>div]:border-none [&>div]:shadow-none [&>div]:bg-transparent"
        />
      </div>
    } @else if (status() === 'ready' && activeStation() && projectId()) {
      <app-consistency-analysis
        [projectId]="projectId()"
        [neighborStation]="activeStation()"
      />
    }
  </div>
</div>
