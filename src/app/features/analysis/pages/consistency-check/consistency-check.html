<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="state.stats()"
    [loading]="state.isLoading()"
    [muted]="state.hasInsufficientData()"
    [isHourly]="state.isHourly()"
  />

  <!-- Card de Seleção e Confirmação da Estação Vizinha -->
  <app-neighbor-stations-card
    [projectId]="state.project()?.id ?? null"
    [mainStation]="state.project()?.station ?? null"
    [neighbors]="state.neighbors()"
    [selectedNeighbor]="state.selectedNeighbor()"
    [activeNeighborStation]="state.activeNeighborStation()"
    [confirmationStatus]="state.confirmationStatus()"
    [neighborProgress]="state.neighborProgress()"
    [neighborJob]="state.neighborJob()"
    [loading]="state.isLoadingNeighbors()"
    [isLoadingData]="state.isLoadingNeighborData()"
    [disabled]="state.isSelectionLocked()"
    [subtitle]="'Escolha uma estação para comparar com a série principal'"
    [confirmActionPrefix]="'Analisar a consistência da série com a estação'"
    [idleMessage]="'Selecione uma estação vizinha na lista ou no mapa para verificar a consistência.'"
    (stationSelected)="state.selectNeighbor($event)"
    (confirmSelection)="state.confirmNeighbor($event)"
    (lockSelection)="state.lockSelection($event)"
    (scrollToSelection)="onScrollToNeighborCard()"
  />

  <!-- Card Independente: Análise de Consistência (Dupla Massa em Largura Total) -->
  @if (shouldShowAnalysisCard) {
    <app-neighbor-analysis-card
      id="neighbor-analysis-card"
      [projectId]="state.project()?.id ?? null"
      [activeStation]="state.activeNeighborStation()"
      [selectedStation]="state.selectedNeighbor()"
      [status]="state.confirmationStatus()"
      [job]="state.neighborJob()"
      [progress]="state.neighborProgress()"
      [isSelectionLocked]="state.isSelectionLocked()"
      (changeStation)="onScrollToNeighborCard()"
    />
  }

  <!-- Rodapé com Ações -->
  <div class="flex w-full items-center justify-between gap-3">
    <button
      hlmBtn
      variant="outline"
      (click)="onBack()"
      [disabled]="isAdvanceDisabled() || isAdvancing()"
    >
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <button
      hlmBtn
      (click)="onAdvance()"
      [disabled]="isAdvanceDisabled() || isAdvancing()"
    >
      @if (isAdvancing()) {
        <hlm-spinner class="mr-2" />
      }
      {{ advanceButtonText() }}
      <ng-icon name="lucideArrowRight" class="ml-2" />
    </button>
  </div>
</div>
