<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- Card de Seleção da Estação Vizinha -->
  <app-neighbor-stations-card
    [mainStation]="project()?.station ?? null"
    [neighbors]="neighbors()"
    [selectedNeighbor]="selectedNeighbor()"
    [loading]="isLoadingNeighbors()"
    [isLoadingData]="isLoadingNeighborData()"
    (stationSelected)="onNeighborSelected($event)"
    (skipClicked)="onSkipToYears()"
  />
</div>
