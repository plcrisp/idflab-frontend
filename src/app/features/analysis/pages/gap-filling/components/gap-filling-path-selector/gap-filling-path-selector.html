<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
  <!-- Card 1: Preencher falhas (Random Forest) -->
  <app-path
    [selected]="selected() === 'fill'"
    [disabled]="disabled()"
    icon="lucideWrench"
    title="Preencher falhas"
    description="Estima os valores ausentes com Random Forest, usando uma estação vizinha"
    (select)="selectOption('fill')"
  >
    @switch (fillStatus()) {
      @case ('idle') {
        <span hlmBadge variant="outline"
          class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 text-muted-foreground border-border bg-secondary/50">
          <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/60"></span>
          Não executado
        </span>
      }
      @case ('running') {
        <span hlmBadge variant="outline"
          class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-primary/10 text-primary border-primary/25">
          <ng-icon name="lucideLoader2" class="animate-spin text-xs text-primary" />
          Executando…
        </span>
      }
      @case ('done') {
        <span hlmBadge variant="outline"
          class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-success/15 text-success border-success/30">
          <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
          Executado
        </span>
      }
      @case ('error') {
        <span hlmBadge variant="outline"
          class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-destructive/15 text-destructive border-destructive/30">
          <span class="h-1.5 w-1.5 rounded-full bg-destructive"></span>
          Falhou
        </span>
      }
    }
  </app-path>

  <!-- Card 2: Desconsiderar anos incompletos (Filtro por limiar) -->
  <app-path
    [selected]="selected() === 'filter'"
    [disabled]="disabled()"
    icon="lucideFilter"
    title="Desconsiderar anos incompletos"
    description="Usa apenas dados observados e remove anos abaixo de um limiar de completude"
    (select)="selectOption('filter')"
  >
    @if (filterApplied()) {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-success/15 text-success border-success/30">
        <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
        Aplicado – {{ filterThreshold() }}%
      </span>
    }
  </app-path>
</div>
