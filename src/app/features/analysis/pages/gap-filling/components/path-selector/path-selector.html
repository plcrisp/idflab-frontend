<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
  <!-- Card 1: Preencher falhas (Random Forest) -->
  <button type="button" (click)="selectOption('fill')" [disabled]="disabled()"
    class="path-card relative flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 px-4 py-3 sm:px-5 sm:py-3.5 pr-10 sm:pr-12 rounded-xl text-left outline-none select-none transition-colors"
    [class.path-card--selected]="selected() === 'fill'" [class.path-card--unselected]="selected() !== 'fill'"
    [class.cursor-pointer]="!disabled()" [class.opacity-60]="disabled()" [class.cursor-not-allowed]="disabled()">
    <!-- Check circular no card selecionado -->
    @if (selected() === 'fill') {
    <div
      class="absolute top-3 right-3 sm:top-3.5 sm:right-3.5 flex items-center justify-center h-5 w-5 rounded-full bg-primary text-primary-foreground shadow-xs pointer-events-none"
      aria-hidden="true">
      <ng-icon name="lucideCheck" class="text-xs" />
    </div>
    }

    <!-- Linha principal: Ícone + Textos -->
    <div class="flex items-center gap-3.5 min-w-0 flex-1">
      <div
        class="flex items-center justify-center h-10 w-10 sm:h-11 sm:w-11 rounded-lg shrink-0 bg-secondary transition-colors duration-150"
        [class.text-primary]="selected() === 'fill'" [class.text-muted-foreground]="selected() !== 'fill'">
        <ng-icon name="lucideWrench" class="text-lg" />
      </div>

      <div class="flex flex-col min-w-0 flex-1 gap-1">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-sm font-semibold text-foreground">
            Preencher falhas
          </h3>
        </div>
        <p class="text-xs text-muted-foreground leading-relaxed">
          Estima os valores ausentes com Random Forest, usando uma estação vizinha
        </p>
      </div>
    </div>

    <!-- Selo de Status -->
    <div
      class="status-slot shrink-0 self-start sm:self-center mt-2 sm:mt-0 min-w-0 sm:min-w-[130px] flex justify-start sm:justify-end">
      @switch (fillStatus()) {
      @case ('idle') {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 text-muted-foreground border-border bg-secondary/50">
        <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/60"></span>
        Não executado
      </span>
      }
      @case ('running') {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-primary/10 text-primary border-primary/25">
        <ng-icon name="lucideLoader2" class="animate-spin text-xs text-primary" />
        Executando…
      </span>
      }
      @case ('done') {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-success/15 text-success border-success/30">
        <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
        Executado
      </span>
      }
      @case ('error') {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-destructive/15 text-destructive border-destructive/30">
        <span class="h-1.5 w-1.5 rounded-full bg-destructive"></span>
        Falhou
      </span>
      }
      }
    </div>
  </button>

  <!-- Card 2: Desconsiderar anos incompletos (Filtro por limiar) -->
  <button type="button" (click)="selectOption('filter')" [disabled]="disabled()"
    class="path-card relative flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 px-4 py-3 sm:px-5 sm:py-3.5 pr-10 sm:pr-12 rounded-xl text-left outline-none select-none transition-colors"
    [class.path-card--selected]="selected() === 'filter'" [class.path-card--unselected]="selected() !== 'filter'"
    [class.cursor-pointer]="!disabled()" [class.opacity-60]="disabled()" [class.cursor-not-allowed]="disabled()">
    <!-- Check circular no card selecionado -->
    @if (selected() === 'filter') {
    <div
      class="absolute top-3 right-3 sm:top-3.5 sm:right-3.5 flex items-center justify-center h-5 w-5 rounded-full bg-primary text-primary-foreground shadow-xs pointer-events-none"
      aria-hidden="true">
      <ng-icon name="lucideCheck" class="text-xs" />
    </div>
    }

    <!-- Linha principal: Ícone + Textos -->
    <div class="flex items-center gap-3.5 min-w-0 flex-1">
      <div
        class="flex items-center justify-center h-10 w-10 sm:h-11 sm:w-11 rounded-lg shrink-0 bg-secondary transition-colors duration-150"
        [class.text-primary]="selected() === 'filter'" [class.text-muted-foreground]="selected() !== 'filter'">
        <ng-icon name="lucideFilter" class="text-lg" />
      </div>

      <div class="flex flex-col min-w-0 flex-1 gap-1">
        <h3 class="text-sm font-semibold text-foreground">
          Desconsiderar anos incompletos
        </h3>
        <p class="text-xs text-muted-foreground leading-relaxed">
          Usa apenas dados observados e remove anos abaixo de um limiar de completude
        </p>
      </div>
    </div>

    <!-- Selo de Status -->
    <div
      class="status-slot shrink-0 self-start sm:self-center mt-2 sm:mt-0 min-w-0 sm:min-w-[130px] flex justify-start sm:justify-end">
      @if (filterStatus() === 'configured') {
      <span hlmBadge variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-success/15 text-success border-success/30">
        <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
        Configurado · {{ filterThreshold() }}%
      </span>
      }
    </div>
  </button>
</div>
