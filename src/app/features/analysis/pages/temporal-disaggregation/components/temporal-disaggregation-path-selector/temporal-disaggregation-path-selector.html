<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
  <!-- Card 1: Fatores CETESB -->
  <app-path
    [selected]="selected() === 'cetesb'"
    [disabled]="disabled()"
    icon="lucideChartColumn"
    title="Fatores CETESB"
    badge="Rápido"
    description="Estima chuvas de 5 min a 24 h aplicando fatores empíricos à chuva máxima diária."
    (select)="selectOption('cetesb')"
  >
    @if (cetesbExecuted()) {
      <span
        hlmBadge
        variant="outline"
        class="text-xs font-medium px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 bg-success/15 text-success border-success/30"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
        Executado
      </span>
    }
  </app-path>

  <!-- Card 2: Bartlett-Lewis -->
  <app-path
    [selected]="selected() === 'bartlett-lewis'"
    [disabled]="disabled() || bartlettDisabled()"
    icon="lucideDroplet"
    title="Bartlett-Lewis"
    [badge]="bartlettBadge()"
    description="Simula a estrutura interna da chuva, calibrada com uma estação de alta resolução próxima."
    (select)="selectOption('bartlett-lewis')"
  />
</div>
