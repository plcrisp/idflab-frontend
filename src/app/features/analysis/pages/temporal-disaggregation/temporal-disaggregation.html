<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- 2. Seletor de Caminho da Desagregação Temporal -->
  <app-temporal-disaggregation-path-selector
    [(selected)]="selectedMethod"
    [bartlettDisabled]="isBartlettDisabled()"
    [isCheckingCandidates]="isCheckingCemaden()"
    [cetesbExecuted]="isCetesbExecuted()"
  />

  <!-- 3. Configuração do Método Selecionado -->
  <app-temporal-disaggregation-config
    [method]="selectedMethod()"
    [isExecuting]="isExecuting()"
    [isExecuted]="isCetesbExecuted()"
    (execute)="onExecuteDisaggregation()"
  />

  <!-- 4. Resultado da Desagregação (quando executado) -->
  @if (isCetesbExecuted() && project(); as p) {
    <app-temporal-disaggregation-result
      [projectId]="p.id"
      [method]="'CETESB'"
    />
  }

  <!-- 5. Rodapé com Ações (Voltar e Avançar) -->
  <div class="flex w-full items-center justify-between gap-3 pt-2">
    <button
      hlmBtn
      variant="outline"
      (click)="onBack()"
      [disabled]="isAdvancing()"
    >
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <button
      hlmBtn
      (click)="onAdvance()"
      [disabled]="!isCetesbExecuted() || isAdvancing()"
    >
      @if (isAdvancing()) {
        <hlm-spinner class="mr-2" />
      }
      Avançar
      <ng-icon name="lucideArrowRight" class="ml-2" />
    </button>
  </div>
</div>
