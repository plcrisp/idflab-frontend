<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- 2. Seletor de Caminho da Desagregação Temporal -->
  <app-temporal-disaggregation-path-selector
    [(selected)]="selectedMethod"
    [bartlettDisabled]="isBartlettDisabled()"
    [isCheckingCandidates]="isLoadingNeighbors()"
    [cetesbExecuted]="isCetesbExecuted()"
    [bartlettExecuted]="isBartlettExecuted()"
  />

  <!-- 3. Configuração do Método Selecionado -->
  @if (selectedMethod() === 'cetesb') {
    <app-temporal-disaggregation-config
      [method]="'cetesb'"
      [isExecuting]="isExecuting()"
      [isExecuted]="isCetesbExecuted()"
      (execute)="onExecuteDisaggregation()"
    />
  } @else {
    <!-- Bartlett-Lewis: Seleção e Coleta de Dados da Estação CEMADEN -->
    <app-neighbor-stations-card
      [projectId]="project()?.id ?? null"
      [mainStation]="project()?.station ?? null"
      [neighbors]="neighbors()"
      [selectedNeighbor]="selectedNeighbor()"
      [activeNeighborStation]="activeNeighborStation()"
      [confirmationStatus]="confirmationStatus()"
      [neighborProgress]="neighborProgress()"
      [neighborJob]="neighborJob()"
      [loading]="isLoadingNeighbors()"
      [isLoadingData]="isLoadingNeighborData() || isDownloadingStation()"
      [disabled]="isProcessing()"
      [subtitle]="'Selecione uma estação CEMADEN para calibrar os 5 parâmetros de Bartlett-Lewis'"
      [highDistanceWarningText]="'Distância elevada pode reduzir a representatividade dos parâmetros calibrados.'"
      [idleMessage]="'Selecione uma estação CEMADEN na lista ou no mapa para calibrar os parâmetros.'"
      [confirmActionPrefix]="'Calibrar e desagregar com a estação'"
      [confirmButtonText]="'Calibrar e desagregar com esta estação'"
      [activeMessagePrefix]="'Calibrando com a estação'"
      (stationSelected)="onSelectCemadenStation($event)"
      (confirmSelection)="onConfirmCemadenStation($event)"
      (scrollToSelection)="scrollToResultCard()"
    />
  }

  <!-- 4. Card de Resultado (Exibe Progresso durante Execução e Resultados ao Finalizar) -->
  @if (showResultCard() && project(); as p) {
    <app-temporal-disaggregation-result
      [projectId]="p.id"
      [method]="executedMethodLabel()"
      [isExecuting]="isProcessing()"
      [job]="activeJobForProgress()"
      [calibrationStation]="activeNeighborStation() ?? selectedNeighbor()"
      [blParams]="calibratedParams()"
      [customMessage]="activeProgressMessage()"
      [customProgress]="activeProgressPercentage()"
    />
  }

  <!-- 5. Rodapé com Ações (Voltar e Avançar) -->
  <div class="flex w-full items-center justify-between gap-3 pt-2">
    <button
      hlmBtn
      variant="outline"
      (click)="onBack()"
      [disabled]="isAdvancing() || isProcessing()"
    >
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <button
      hlmBtn
      (click)="onAdvance()"
      [disabled]="!isCurrentMethodExecuted() || isAdvancing() || isProcessing()"
    >
      @if (isAdvancing()) {
        <hlm-spinner class="mr-2" />
      }
      Avançar
      <ng-icon name="lucideArrowRight" class="ml-2" />
    </button>
  </div>
</div>
