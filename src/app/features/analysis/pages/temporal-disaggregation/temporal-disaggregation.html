<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- 2. Seletor de Caminho da Desagregação Temporal -->
  <app-temporal-disaggregation-path-selector [(selected)]="selectedMethod" />
</div>
