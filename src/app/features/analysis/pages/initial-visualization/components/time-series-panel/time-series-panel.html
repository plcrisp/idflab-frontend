<div
  class="h-full w-full min-w-0 flex flex-col rounded-xl border border-border bg-popover text-foreground overflow-hidden"
>
  <div class="flex items-center justify-between border-b border-border p-4">
    <div class="flex items-center gap-2">
      <h3 class="text-sm font-semibold uppercase tracking-wide text-foreground">
        Precipitações diárias máximas anuais
      </h3>
      @if (firstYear() && lastYear()) {
        <span class="text-sm font-normal text-muted-foreground">
          · {{ firstYear() }} - {{ lastYear() }}
        </span>
      }
    </div>
  </div>

  <app-annual-max-overview-chart
    [data]="yearly_summary()"
    [selectedYear]="selectedYear()"
    [historicalMaxValue]="historicalMaxValue()"
    (yearClick)="onYearClick($event)"
  ></app-annual-max-overview-chart>

  <div class="border-t border-border p-4 flex items-center justify-between gap-4 min-w-0">
    <h3 class="text-sm font-semibold uppercase tracking-wide text-foreground">
      Série temporal de precipitação diária
    </h3>

    <hlm-date-range-picker
      [min]="minDate()"
      [max]="maxDate()"
      [date]="pickerDate()"
      [maxSpanDays]="365"
      [autoCloseOnEndSelection]="true"
      captionLayout="dropdown"
      [formatDates]="formatDates"
      (dateChange)="onDateRangeChange($event)"
      class="w-auto"
    >
      <span class="text-sm text-muted-foreground">Filtrar período...</span>
    </hlm-date-range-picker>
  </div>

  <app-time-series-detail-chart
    [data]="detail()"
    [historicalMaxDate]="max_value_date()"
    [historicalMaxValue]="historicalMaxValue()"
  ></app-time-series-detail-chart>
</div>
