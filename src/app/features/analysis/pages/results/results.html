<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isSummaryLoading() || isResultsLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- 2. Alerta de Erro (quando a requisição falha) -->
  @if (errorMessage(); as err) {
    <div
      class="flex flex-wrap items-center justify-between gap-3 p-4 rounded-xl border border-destructive/20 bg-destructive/10 text-destructive text-sm"
    >
      <div class="flex items-center gap-2.5">
        <ng-icon name="lucideTriangleAlert" class="text-base shrink-0" />
        <span>{{ err }}</span>
      </div>
      <div class="flex items-center gap-2">
        <button
          hlmBtn
          variant="outline"
          size="sm"
          type="button"
          (click)="onBack()"
          class="text-xs border-destructive/30 hover:bg-destructive/20 text-destructive cursor-pointer"
        >
          Voltar para Cenários Futuros
        </button>
        <button
          hlmBtn
          variant="outline"
          size="sm"
          type="button"
          (click)="onRetry()"
          class="text-xs border-destructive/30 hover:bg-destructive/20 text-destructive cursor-pointer"
        >
          <ng-icon name="lucideRotateCw" class="mr-1.5 text-xs" />
          Tentar novamente
        </button>
      </div>
    </div>
  }

  <!-- 3. Skeleton Loading (quando está calculando ou carregando pela 1ª vez) -->
  @if (isResultsLoading() && !resultsData()) {
    <!-- Skeleton Card 1: Equação Dupla -->
    <div class="w-full flex flex-col rounded-xl border border-border bg-popover p-5 gap-4 animate-pulse">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <div hlmSkeleton class="h-4 w-40 rounded"></div>
        <div hlmSkeleton class="h-4 w-52 rounded"></div>
      </div>
      <div class="flex flex-col xl:flex-row justify-between gap-4">
        <div hlmSkeleton class="h-14 w-48 rounded-lg"></div>
        <div class="flex flex-col gap-2.5">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
            <div hlmSkeleton class="h-12 w-20 rounded-lg"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Skeleton Card 2: Curvas IDF e Tabelas -->
    <div class="w-full flex flex-col rounded-xl border border-border bg-popover p-5 gap-4 animate-pulse">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <div hlmSkeleton class="h-4 w-32 rounded"></div>
        <div hlmSkeleton class="h-7 w-60 rounded-lg"></div>
      </div>
      <div hlmSkeleton class="h-96 w-full rounded-lg"></div>
    </div>
  }

  <!-- 4. Conteúdo Principal da Tela de Resultados -->
  @if (resultsData(); as data) {
    <!-- CARD 1: EQUAÇÃO IDF DUPLA (Histórica + Futura) -->
    <app-historical-idf-equation-card
      [data]="data.historical_idf"
      [futureData]="data.future_idf"
      [distributionName]="distributionFullName()"
      [distributionColor]="distributionColor()"
      [configSubtitle]="data.config_subtitle"
    />

    <!-- CARD 2: CURVAS IDF E TABELAS (Curvas | Intensidade | Variação (%)) -->
    <app-results-curves-card
      [resultsData]="data"
      [loading]="isResultsLoading()"
    />
  }

  <!-- 5. Rodapé da Página: Voltar | Baixar CSV | Concluir análise -->
  <div class="flex flex-wrap w-full items-center justify-between gap-3 pt-2">
    <button hlmBtn variant="outline" type="button" (click)="onBack()">
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <div class="flex items-center gap-2.5 ml-auto">
      <button
        hlmBtn
        variant="outline"
        type="button"
        (click)="onDownloadCsv()"
        [disabled]="isResultsLoading() || !resultsData() || isDownloadingCsv()"
        class="cursor-pointer inline-flex items-center gap-2"
      >
        @if (isDownloadingCsv()) {
          <ng-icon name="lucideLoader2" class="animate-spin text-xs" />
          <span>Baixando…</span>
        } @else {
          <ng-icon name="lucideDownload" class="text-xs" />
          <span>Baixar CSV</span>
        }
      </button>

      <button
        hlmBtn
        type="button"
        (click)="onFinish()"
        [disabled]="isResultsLoading() || !resultsData()"
        class="cursor-pointer inline-flex items-center gap-2"
      >
        <ng-icon name="lucideCheck" class="text-xs" />
        <span>Concluir análise</span>
      </button>
    </div>
  </div>
</div>
