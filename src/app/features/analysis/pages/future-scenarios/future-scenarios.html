<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isSummaryLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- 2. Card de Esqueleto / Placeholder dos Cenários Futuros -->
  <div
    class="rounded-xl border border-border bg-card p-8 shadow-xs flex flex-col items-center justify-center text-center min-h-90 gap-4"
  >
    <div
      class="h-14 w-14 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-primary"
    >
      <ng-icon name="lucideSparkles" class="text-2xl" />
    </div>

    <div class="space-y-1.5 max-w-md">
      <h2 class="text-lg font-semibold text-foreground tracking-tight">
        Cenários Futuros
      </h2>
      <p class="text-sm text-muted-foreground">
        Esta etapa de projeções climáticas e análise sob cenários futuros está em desenvolvimento.
      </p>
    </div>

    <div
      class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground border border-border"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-primary animate-pulse"></span>
      Etapa em Construção
    </div>
  </div>

  <!-- 3. Rodapé com Ações -->
  <div class="flex w-full items-center justify-between gap-3 pt-2">
    <button hlmBtn variant="outline" type="button" (click)="onBack()">
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <button hlmBtn type="button" (click)="onAdvance()">
      <span>Avançar</span>
      <ng-icon name="lucideArrowRight" class="ml-2" />
    </button>
  </div>
</div>
