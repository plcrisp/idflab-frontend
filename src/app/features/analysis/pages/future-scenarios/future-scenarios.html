<div class="flex flex-col gap-4 overflow-x-hidden">
  <!-- 1. Barra de Resumo Compacta da Estação -->
  <app-station-summary-bar
    [stats]="stats()"
    [loading]="isSummaryLoading()"
    [muted]="hasInsufficientData()"
    [isHourly]="isHourly()"
  />

  <!-- Alerta de Estado Bloqueado -->
  @if (isBlocked()) {
    <div
      class="w-full p-4 rounded-xl border border-warning/30 bg-warning/10 text-warning text-xs sm:text-sm flex items-start gap-3 font-medium"
    >
      <ng-icon name="lucideTriangleAlert" class="text-base shrink-0 mt-0.5" />
      <div class="flex flex-col gap-1">
        <span class="font-semibold">Cenários futuros indisponíveis para esta estação</span>
        <span class="text-xs text-warning/90 leading-relaxed">{{ blockedMessage() }}</span>
      </div>
    </div>
  }

  <!-- 2. Seletor de Método de Correção de Viés (EQM / QM / DBC) -->
  <app-future-scenarios-method-selector
    [(selected)]="selectedMethod"
    [appliedMethod]="appliedMethod()"
    [disabled]="isProcessing() || isBlocked() || (!showConfigFooter() && hasResult())"
  />

  <!-- 3. Card: Configuração da Projeção (Mapa ampliado + Controles + Card de contexto + Botão aplicar) -->
  <app-future-scenarios-config-card
    [station]="project()?.station ?? null"
    [cells]="cells()"
    [radiusKm]="analysisRadiusKm()"
    [distributionName]="distributionFullName()"
    [distributionColor]="distributionColor()"
    [inheritedDisaggregation]="inheritedDisaggregationText()"
    [referenceWindow]="referenceWindowText()"
    [isProcessing]="isProcessing()"
    [isBlocked]="isBlocked()"
    [showFooter]="showConfigFooter()"
    [canApplyBackend]="state()?.can_apply ?? true"
    [hasValidMethod]="selectedMethod() !== null"
    [(selectedModel)]="selectedModel"
    [(selectedSsp)]="selectedSsp"
    [(startYear)]="startYear"
    [(endYear)]="endYear"
    (apply)="onApply()"
  />

  <!-- 4. Estado ERROR: Mensagem sanitizada + Botão "Tentar novamente" -->
  @if (isError()) {
    <div
      class="w-full min-w-0 flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 sm:p-5 rounded-xl border border-destructive/30 bg-destructive/10 text-destructive text-xs sm:text-sm"
    >
      <div class="flex items-start gap-3">
        <ng-icon name="lucideTriangleAlert" class="text-base shrink-0 mt-0.5" />
        <div class="flex flex-col gap-1">
          <span class="font-semibold">Erro ao processar correção de viés</span>
          <span class="text-xs text-destructive/90 leading-relaxed">{{ errorMessage() }}</span>
        </div>
      </div>

      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        (click)="onApply()"
        class="text-xs border-destructive/30 hover:bg-destructive/20 text-destructive shrink-0 cursor-pointer self-end sm:self-center"
      >
        <ng-icon name="lucideRotateCw" class="mr-1.5 text-xs" />
        <span>Tentar novamente</span>
      </button>
    </div>
  }

  <!-- 5. Card: RESULTADO DA CORREÇÃO (aparece em PROCESSING, RESULT e OUTDATED) -->
  @if (showResultCard()) {
    <app-future-scenarios-result-card
      [result]="state()?.result ?? null"
      [uiState]="effectiveUiState()"
      [isProcessing]="isProcessing()"
      [isOutdated]="isOutdated()"
      [isEditing]="isEditingParams()"
      [progressMessage]="progressMessage()"
      [progressPercentage]="progressPercentage()"
      [outdatedMessage]="outdatedMessage()"
      [selectedMethod]="selectedMethod()"
      [selectedModel]="selectedModel()"
      [selectedSspLabel]="selectedSspLabel()"
      (editParams)="onEditParams()"
      (cancelEdit)="onCancelEdit()"
    />
  }

  <!-- 6. Rodapé da Página: Voltar e Avançar -->
  <div class="flex w-full items-center justify-between gap-3 pt-2">
    <button
      hlmBtn
      variant="outline"
      type="button"
      (click)="onBack()"
      [disabled]="isProcessing() || isAdvancing()"
    >
      <ng-icon name="lucideArrowLeft" class="mr-2" />
      Voltar
    </button>

    <div class="flex items-center gap-2.5 ml-auto">
      <button
        hlmBtn
        variant="outline"
        type="button"
        (click)="onDownloadFutureMax()"
        [disabled]="!hasResult() || isProcessing() || isDownloadingFutureMax()"
        class="cursor-pointer inline-flex items-center"
      >
        @if (isDownloadingFutureMax()) {
          <hlm-spinner class="mr-2" />
          <span>Baixando…</span>
        } @else {
          <ng-icon name="lucideDownload" class="mr-2 text-xs" />
          <span>Baixar máximos futuros</span>
        }
      </button>

      <button
        hlmBtn
        type="button"
        (click)="onAdvance()"
        [disabled]="!canAdvance()"
      >
      @if (isAdvancing()) {
        <ng-icon name="lucideLoader2" class="animate-spin mr-2" />
      }
      <span>{{ advanceButtonLabel() }}</span>
      <ng-icon [name]="advanceButtonIcon()" class="ml-2 text-xs" />
    </button>
    </div>
  </div>
</div>
