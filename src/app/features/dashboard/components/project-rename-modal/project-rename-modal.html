@if (isOpen()) {
<div
  class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 modal-backdrop-anim"
  (click)="onCancel()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="rename-modal-title"
>
  <div
    class="bg-popover border border-border rounded-xl shadow-2xl p-6 max-w-md w-full relative z-10 modal-content-anim space-y-4"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-3">
      <div class="space-y-1">
        <h3 id="rename-modal-title" class="text-base font-semibold text-foreground">
          Renomear Projeto
        </h3>
        <p class="text-xs text-muted-foreground">
          Altere o nome de identificação deste estudo hidrológico.
        </p>
      </div>

      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSaving()"
        class="text-muted-foreground hover:text-foreground transition-colors p-1 rounded-md hover:bg-secondary cursor-pointer"
      >
        <ng-icon name="lucideX" class="w-4 h-4"></ng-icon>
      </button>
    </div>

    <div class="space-y-1.5 pt-1">
      <label for="project-rename-input" class="text-xs font-medium text-foreground">
        Nome do Projeto
      </label>
      <input
        id="project-rename-input"
        hlmInput
        [ngModel]="inputValue()"
        (ngModelChange)="inputValue.set($event)"
        (keydown.enter)="onSave()"
        [disabled]="isSaving()"
        placeholder="Ex: IDF Bacia do Rio Claro"
        class="w-full text-xs sm:text-sm bg-card border-border"
        autofocus
      />

      @if (errorMessage()) {
      <p class="text-xs text-destructive font-medium pt-1">
        {{ errorMessage() }}
      </p>
      }
    </div>

    <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-border">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSaving()"
        hlmBtn
        variant="outline"
        size="sm"
        class="text-xs"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onSave()"
        [disabled]="isSaving()"
        hlmBtn
        variant="default"
        size="sm"
        class="gap-1.5 text-xs font-medium"
      >
        @if (isSaving()) {
        <ng-icon name="lucideLoader2" class="w-3.5 h-3.5 animate-spin"></ng-icon>
        <span>Salvando...</span>
        } @else {
        <ng-icon name="lucideCheck" class="w-3.5 h-3.5"></ng-icon>
        <span>Salvar</span>
        }
      </button>
    </div>
  </div>
</div>
}
