@if (isOpen()) {
<div
  class="modal-overlay"
  (click)="onCancel()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="rename-modal-title"
>
  <div
    class="modal-container max-w-md"
    (click)="$event.stopPropagation()"
  >
    <!-- Cabeçalho no padrão StationModal -->
    <div class="modal-header">
      <div class="header-titles">
        <h2 id="rename-modal-title">Renomear Projeto</h2>
        <p>Altere o nome de identificação deste estudo hidrológico.</p>
      </div>

      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSaving()"
        class="close-btn"
        aria-label="Fechar"
      >
        <ng-icon name="lucideX" class="w-4 h-4"></ng-icon>
      </button>
    </div>

    <!-- Corpo com formulário -->
    <div class="modal-body space-y-1.5">
      <label for="project-rename-input" class="text-xs font-medium text-foreground">
        Nome do Projeto
      </label>
      <input
        id="project-rename-input"
        hlmInput
        [ngModel]="inputValue()"
        (ngModelChange)="inputValue.set($event)"
        (keydown.enter)="onSave()"
        [disabled]="isSaving()"
        placeholder="Ex: IDF Bacia do Rio Claro"
        class="w-full text-xs sm:text-sm bg-background border-border shadow-none"
        autofocus
      />

      @if (errorMessage()) {
        <p class="text-xs text-destructive font-medium pt-1">
          {{ errorMessage() }}
        </p>
      }
    </div>

    <!-- Rodapé de Ações com divisória -->
    <div class="modal-footer">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSaving()"
        hlmBtn
        variant="outline"
        size="sm"
        class="text-xs cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onSave()"
        [disabled]="isSaving()"
        hlmBtn
        variant="default"
        size="sm"
        class="gap-1.5 text-xs font-medium cursor-pointer"
      >
        @if (isSaving()) {
          <ng-icon name="lucideLoader2" class="w-3.5 h-3.5 animate-spin"></ng-icon>
          <span>Salvando...</span>
        } @else {
          <ng-icon name="lucideCheck" class="w-3.5 h-3.5"></ng-icon>
          <span>Salvar</span>
        }
      </button>
    </div>
  </div>
</div>
}
