<div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 w-full">
  <!-- Lado Esquerdo: Campo de Busca e Abas de Filtro agrupadas -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 flex-1 min-w-0">
    <!-- Campo de Busca -->
    <div class="relative w-full sm:w-72 md:w-80 shrink-0">
      <ng-icon
        name="lucideSearch"
        class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground w-4 h-4 pointer-events-none"
      ></ng-icon>
      <input
        hlmInput
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Buscar projeto..."
        class="pl-9 pr-8 w-full text-xs sm:text-sm h-9 bg-card border-border"
      />
      @if (searchQuery()) {
        <button
          type="button"
          (click)="onClearSearch()"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors p-0.5 cursor-pointer"
          title="Limpar busca"
        >
          <ng-icon name="lucideX" class="w-3.5 h-3.5"></ng-icon>
        </button>
      }
    </div>

    <!-- Abas de Filtro -->
    <div class="inline-flex items-center p-1 bg-muted/40 border border-border rounded-lg self-start sm:self-auto shrink-0">
      <button
        type="button"
        (click)="onSelectStatus('ALL')"
        class="px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
        [ngClass]="
          statusFilter() === 'ALL'
            ? 'bg-card text-foreground font-semibold shadow-xs border border-border/50'
            : 'text-muted-foreground hover:text-foreground hover:bg-muted/60'
        "
      >
        Todos ({{ stats().total }})
      </button>
      <button
        type="button"
        (click)="onSelectStatus('IN_PROGRESS')"
        class="px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
        [ngClass]="
          statusFilter() === 'IN_PROGRESS'
            ? 'bg-card text-foreground font-semibold shadow-xs border border-border/50'
            : 'text-muted-foreground hover:text-foreground hover:bg-muted/60'
        "
      >
        Em andamento ({{ stats().inProgress }})
      </button>
      <button
        type="button"
        (click)="onSelectStatus('COMPLETED')"
        class="px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
        [ngClass]="
          statusFilter() === 'COMPLETED'
            ? 'bg-card text-foreground font-semibold shadow-xs border border-border/50'
            : 'text-muted-foreground hover:text-foreground hover:bg-muted/60'
        "
      >
        Concluídos ({{ stats().completed }})
      </button>
    </div>
  </div>

  <!-- Lado Direito: Botão Primário "Nova análise" -->
  <a
    routerLink="/app/interactive-map"
    hlmBtn
    variant="default"
    size="sm"
    class="h-9 px-3.5 gap-1.5 font-medium shrink-0 shadow-xs text-xs cursor-pointer self-start md:self-auto"
  >
    <ng-icon name="lucideMap" class="w-3.5 h-3.5"></ng-icon>
    <span>Nova análise</span>
  </a>
</div>
