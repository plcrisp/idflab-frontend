<div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 rounded-xl shadow-sm border border-border bg-popover p-4 w-full">
  <!-- Campo de Busca -->
  <div class="relative flex-1 max-w-md">
    <ng-icon
      name="lucideSearch"
      class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground w-4 h-4 pointer-events-none"
    ></ng-icon>
    <input
      hlmInput
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchInput($event)"
      placeholder="Buscar por projeto, estação, código ou UF..."
      class="pl-9 pr-8 w-full text-xs sm:text-sm h-9 bg-card border-border"
    />
    @if (searchQuery()) {
    <button
      type="button"
      (click)="onClearSearch()"
      class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors p-0.5 cursor-pointer"
      title="Limpar busca"
    >
      <ng-icon name="lucideX" class="w-3.5 h-3.5"></ng-icon>
    </button>
    }
  </div>

  <!-- Pílulas de Filtro Rápido -->
  <div class="inline-flex items-center p-1 bg-card border border-border rounded-lg self-start sm:self-auto shrink-0">
    <button
      type="button"
      (click)="onSelectStatus('ALL')"
      class="px-3 py-1 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
      [ngClass]="
        statusFilter() === 'ALL'
          ? 'bg-primary text-primary-foreground font-semibold shadow-xs'
          : 'text-muted-foreground hover:text-foreground hover:bg-secondary/60'
      "
    >
      Todos ({{ stats().total }})
    </button>
    <button
      type="button"
      (click)="onSelectStatus('IN_PROGRESS')"
      class="px-3 py-1 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
      [ngClass]="
        statusFilter() === 'IN_PROGRESS'
          ? 'bg-primary text-primary-foreground font-semibold shadow-xs'
          : 'text-muted-foreground hover:text-foreground hover:bg-secondary/60'
      "
    >
      Em Andamento ({{ stats().inProgress }})
    </button>
    <button
      type="button"
      (click)="onSelectStatus('COMPLETED')"
      class="px-3 py-1 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer"
      [ngClass]="
        statusFilter() === 'COMPLETED'
          ? 'bg-primary text-primary-foreground font-semibold shadow-xs'
          : 'text-muted-foreground hover:text-foreground hover:bg-secondary/60'
      "
    >
      Concluídos ({{ stats().completed }})
    </button>
  </div>
</div>
