<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
  <div
    class="h-full cursor-pointer transition-all duration-150 rounded-xl hover:opacity-95 focus:outline-none"
    [class.ring-1]="activeFilter() === 'ALL'"
    [class.ring-primary]="activeFilter() === 'ALL'"
    [class.shadow-md]="activeFilter() === 'ALL'"
    (click)="onSelect('ALL')"
    (keydown.enter)="onSelect('ALL')"
    tabindex="0"
    role="button"
    aria-label="Filtrar todos os projetos"
  >
    <app-stat-card
      label="Total de Projetos"
      icon="lucideFolderOpen"
      [value]="stats().total"
      [loading]="loading()"
      [footer]="totalFooter()"
      iconVariant="default"
    />
  </div>

  <div
    class="h-full cursor-pointer transition-all duration-150 rounded-xl hover:opacity-95 focus:outline-none"
    [class.ring-1]="activeFilter() === 'IN_PROGRESS'"
    [class.ring-warning]="activeFilter() === 'IN_PROGRESS'"
    [class.shadow-md]="activeFilter() === 'IN_PROGRESS'"
    (click)="onSelect('IN_PROGRESS')"
    (keydown.enter)="onSelect('IN_PROGRESS')"
    tabindex="0"
    role="button"
    aria-label="Filtrar projetos em andamento"
  >
    <app-stat-card
      label="Em Andamento"
      icon="lucideClock"
      [value]="stats().inProgress"
      [loading]="loading()"
      [footer]="inProgressFooter()"
      [badge]="inProgressBadge()"
      iconVariant="warning"
    />
  </div>

  <div
    class="h-full cursor-pointer transition-all duration-150 rounded-xl hover:opacity-95 focus:outline-none"
    [class.ring-1]="activeFilter() === 'COMPLETED'"
    [class.ring-success]="activeFilter() === 'COMPLETED'"
    [class.shadow-md]="activeFilter() === 'COMPLETED'"
    (click)="onSelect('COMPLETED')"
    (keydown.enter)="onSelect('COMPLETED')"
    tabindex="0"
    role="button"
    aria-label="Filtrar projetos concluídos"
  >
    <app-stat-card
      label="Concluídos"
      icon="lucideCircleCheck"
      [value]="stats().completed"
      [loading]="loading()"
      [footer]="completedFooter()"
      [badge]="completedBadge()"
      iconVariant="success"
    />
  </div>
</div>
