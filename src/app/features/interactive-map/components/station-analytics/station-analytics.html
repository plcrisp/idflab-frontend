@if (loading()) {
  <div class="p-4 flex flex-col gap-3.5 overflow-y-auto">
    <!-- 1. Total de estações skeleton -->
    <div class="flex items-baseline gap-2">
      <div hlmSkeleton class="h-7 w-16 rounded-md"></div>
      <div hlmSkeleton class="h-3.5 w-32 rounded-md"></div>
    </div>

    <!-- 2. Operabilidade da rede skeleton -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <div hlmSkeleton class="h-3 w-28 rounded-md"></div>
        <div hlmSkeleton class="h-3 w-8 rounded-md"></div>
      </div>
      <div hlmSkeleton class="h-1.5 w-full rounded-full"></div>
    </div>

    <!-- 3. Cards das redes (INMET, CEMADEN, ANA) skeleton -->
    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-border">
      <div class="flex flex-col items-center p-2 rounded-lg bg-secondary/50 border border-border/50 gap-1.5">
        <div hlmSkeleton class="h-2.5 w-10 rounded-sm"></div>
        <div hlmSkeleton class="h-4 w-8 rounded-sm bg-primary/20"></div>
      </div>
      <div class="flex flex-col items-center p-2 rounded-lg bg-secondary/50 border border-border/50 gap-1.5">
        <div hlmSkeleton class="h-2.5 w-12 rounded-sm"></div>
        <div hlmSkeleton class="h-4 w-8 rounded-sm" style="background-color: color-mix(in srgb, var(--cemaden) 20%, transparent)"></div>
      </div>
      <div class="flex flex-col items-center p-2 rounded-lg bg-secondary/50 border border-border/50 gap-1.5">
        <div hlmSkeleton class="h-2.5 w-8 rounded-sm"></div>
        <div hlmSkeleton class="h-4 w-8 rounded-sm" style="background-color: color-mix(in srgb, var(--ana) 20%, transparent)"></div>
      </div>
    </div>
  </div>
} @else {
  <div class="p-4 flex flex-col gap-3.5 overflow-y-auto">
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-bold tracking-tight text-foreground tabular-nums">{{ stats().totalStations }}</span>
      <span class="text-xs text-muted-foreground font-medium">estações na área visível</span>
    </div>

    <div class="space-y-1.5">
      <div class="flex items-center justify-between text-xs">
        <span class="text-xs text-muted-foreground font-medium">Operabilidade da Rede</span>
        <span class="text-xs font-semibold text-foreground tabular-nums">{{ stats().activePercentage }}%</span>
      </div>

      <div class="h-1.5 w-full bg-secondary rounded-full overflow-hidden flex">
        <div class="h-full bg-[var(--inmet)] transition-all duration-300" [style.width.%]="stats().inmetActiveShare"></div>
        <div class="h-full bg-[var(--cemaden)] transition-all duration-300" [style.width.%]="stats().cemadenActiveShare"></div>
        <div class="h-full bg-[var(--ana)] transition-all duration-300" [style.width.%]="stats().anaActiveShare"></div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-border">
      <div class="flex flex-col p-2 rounded-lg bg-secondary/50 border border-border/50 text-center">
        <span class="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider mb-0.5">INMET</span>
        <span class="text-sm font-semibold text-[var(--inmet)] tabular-nums">{{ stats().inmetCount }}</span>
      </div>

      <div class="flex flex-col p-2 rounded-lg bg-secondary/50 border border-border/50 text-center">
        <span class="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider mb-0.5">CEMADEN</span>
        <span class="text-sm font-semibold text-[var(--cemaden)] tabular-nums">{{ stats().cemadenCount }}</span>
      </div>

      <div class="flex flex-col p-2 rounded-lg bg-secondary/50 border border-border/50 text-center">
        <span class="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider mb-0.5">ANA</span>
        <span class="text-sm font-semibold text-[var(--ana)] tabular-nums">{{ stats().anaCount }}</span>
      </div>
    </div>
  </div>
}
