<div class="dashboard-stats">
  <div class="main-metric">
    <span class="metric-value">{{ stats().totalStations }}</span>
    <span class="metric-label">estações na área visível</span>
  </div>

  <div class="health-section">
    <div class="health-info">
      <span class="health-label">Operabilidade da Rede</span>
      <span class="health-value">{{ stats().activePercentage }}%</span>
    </div>

    <div class="health-track">
      <div class="health-fill inmet" [style.width.%]="stats().inmetActiveShare"></div>

      <div class="health-fill cemaden" [style.width.%]="stats().cemadenActiveShare"></div>

      <div class="health-fill ana" [style.width.%]="stats().anaActiveShare"></div>
    </div>
  </div>

  <div class="sources-breakdown">
    <div class="source-stat inmet">
      <span class="source-name">INMET</span>
      <span class="source-count">{{ stats().inmetCount }}</span>
    </div>
    <div class="source-stat cemaden">
      <span class="source-name">CEMADEN</span>
      <span class="source-count">{{ stats().cemadenCount }}</span>
    </div>
    <div class="source-stat ana">
      <span class="source-name">ANA</span>
      <span class="source-count">{{ stats().anaCount }}</span>
    </div>
  </div>
</div>
