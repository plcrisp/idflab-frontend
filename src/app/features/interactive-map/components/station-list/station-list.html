<div class="flex flex-col max-h-90">
  <!-- Cabeçalho de Contexto -->
  <div class="px-3.5 py-2 text-[10px] font-semibold uppercase tracking-wider text-muted-foreground flex items-center justify-between border-b border-border bg-secondary/20 shrink-0">
    <span>Estações na Região</span>
    <span class="text-[11px] font-medium normal-case tracking-normal text-muted-foreground tabular-nums">
      {{ sortedStations().length }} {{ sortedStations().length === 1 ? 'estação' : 'estações' }}
    </span>
  </div>

  <!-- Lista limpa com divisórias sutis -->
  <div class="divide-y divide-border/50 overflow-y-auto">
    @for (item of sortedStations(); track item.station.id) {
      <div
        role="button"
        tabindex="0"
        (click)="flyToStation(item.station.id)"
        (keydown.enter)="flyToStation(item.station.id)"
        [ngClass]="{ 'opacity-55': !item.available }"
        class="group w-full px-3.5 py-2.5 hover:bg-secondary/50 transition-colors cursor-pointer select-none text-left flex items-center justify-between gap-3 outline-none focus-visible:bg-secondary/70"
      >
        <div class="flex flex-col gap-1.5 min-w-0 flex-1">
          <!-- Linha 1: Nome da Estação -->
          <span
            class="font-semibold text-[13px] text-foreground truncate leading-tight"
            [title]="item.station.name | titlecase"
          >
            {{ item.station.name | titlecase }}
          </span>

          <!-- Linha 2: Fonte + Período histórico alinhados à esquerda -->
          <div class="flex items-center gap-2">
            <span
              hlmBadge
              [ngClass]="item.station.source.toLowerCase()"
              [title]="item.station.source + ' ' + item.station.code"
              class="border-none font-medium text-[11px] px-1.5 py-0.5 rounded-md flex items-center shrink-0"
            >
              <span class="h-1.5 w-1.5 rounded-full bg-current mr-1.5"></span>
              {{ item.station.source }}
            </span>

            <span class="text-xs text-muted-foreground truncate">
              {{ item.periodLabel }}
            </span>
          </div>
        </div>

        <!-- Direita centralizada: Indicador de Status + Seta -->
        <div class="flex items-center gap-2 shrink-0">
          <span
            class="w-1.5 h-1.5 rounded-full"
            [title]="item.station.status || 'Status não informado'"
            [ngClass]="
              item.station.status === 'Operante'
                ? 'bg-emerald-500'
                : item.station.status === 'Pane' || item.station.status === 'Falha'
                  ? 'bg-amber-500'
                  : 'bg-muted-foreground'
            "
          ></span>

          <ng-icon
            name="lucideChevronRight"
            class="w-3.5 h-3.5 text-muted-foreground opacity-40 group-hover:opacity-100 group-hover:text-foreground group-hover:translate-x-0.5 transition-all"
          />
        </div>
      </div>
    }
  </div>
</div>
