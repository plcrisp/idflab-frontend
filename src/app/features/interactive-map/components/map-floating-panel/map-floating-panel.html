<div class="absolute top-4 left-4 w-80 sm:w-[340px] max-h-[calc(100%-2rem)] flex flex-col bg-card border border-border rounded-xl shadow-lg z-10 overflow-hidden">
  <app-station-search />

  @if (station()) {
    <app-select-station (open)="toggleModal()" />
  } @else if (stations().length > 0) {
    <app-station-list />
  } @else {
    <app-station-analytics />
  }
</div>

@if (showStationTypeModal) {
  <app-station-modal (close)="toggleModal()" />
}
