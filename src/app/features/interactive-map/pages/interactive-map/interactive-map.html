<div class="map-wrapper">
  <div id="map" class="mapbox-layer"></div>

  <app-loading-overlay *ngIf="isLoadingMap" message="Carregando o Mapa Interativo">
  </app-loading-overlay>

  <div class="floating-panel">
    <div class="panel-header">
      <h2 class="panel-title">Buscar Estações</h2>

      <div class="search-box">
        <ng-icon name="lucideSearch" class="search-icon"></ng-icon>
        <input type="text" placeholder="São Paulo, SP..." class="search-input" />
      </div>

      <div class="filters-row">
        <span class="period-text">Período: <strong>1990 — 2023</strong></span>
        <div class="network-toggles">
          <button class="toggle-chip inmet active">INMET</button>
          <button class="toggle-chip cemaden active">CEMADEN</button>
        </div>
      </div>
    </div>

    <div class="station-list">
      <div *ngFor="let station of stations" class="station-item">
        <div class="station-info">
          <span class="station-name">{{ station.name }}</span>
          <div class="station-meta">
            <span class="network-badge" [ngClass]="station.source.toLowerCase()"
              >{{ station.source }} {{ station.code }}</span
            >
            <span class="coords"
              >{{ math.abs(station.latitude) | number:'1.3-3' }}°S, {{ math.abs(station.longitude) |
              number:'1.3-3' }}°W</span
            >
          </div>
        </div>

        <div class="station-status">
          <div class="status-dot" [ngClass]="station.status.toLowerCase()"></div>
          <span class="status-label">{{ station.status }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
