<header
  class="flex items-center justify-between h-12 px-6 bg-(--primary-900) z-10 transition-all duration-300 ease-out"
  [class.sidebar-collapsed]="mainLayoutService.isSidebarCollapsed()"
>
  <div class="flex items-center gap-6">
    <button hlmSidebarTrigger variant="ghost" class="h-8 w-8 px-0">
      <span class="sr-only"></span>
    </button>
    <nav hlmBreadcrumb class="breadcrumb">
      <ol hlmBreadcrumbList>
        <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
          <li hlmBreadcrumbItem>
            <a *ngIf="!last" hlmBreadcrumbLink [href]="crumb.url || '#'"> {{ crumb.label }} </a>
            <span *ngIf="last" hlmBreadcrumbPage> {{ crumb.label }} </span>
          </li>
          <li hlmBreadcrumbSeparator *ngIf="!last"></li>
        </ng-container>
      </ol>
    </nav>
  </div>

  <div class="flex items-center gap-5">
    <app-notifications-bell></app-notifications-bell>

    <div class="w-px h-6 bg-(--border-alt)"></div>

    <!-- Gatilho de Ajuda Contextual -->
    <button
      type="button"
      (click)="helpService.toggle()"
      [hlmTooltip]="'Ajuda'"
      position="bottom"
      aria-label="Ajuda"
      class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-transparent text-white transition-colors hover:bg-sidebar-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring cursor-pointer"
    >
      <ng-icon name="lucideCircleQuestionMark" class="text-base text-(--primary-50)"></ng-icon>
      <span class="text-sm font-light">Ajuda</span>
    </button>

    <div class="w-px h-6 bg-(--border-alt)"></div>

    <app-theme-toggle [isFixed]="false"></app-theme-toggle>

    <div class="w-px h-6 bg-(--border-alt)"></div>

    <div class="relative group" [hlmDropdownMenuTrigger]="menuProfile">
      <button
        class="flex items-center gap-3 px-3 py-1 rounded-md bg-transparent text-white transition-colors hover:bg-sidebar-accent cursor-pointer"
      >
        <hlm-avatar class="h-8 w-8 text-xs">
          <img hlmAvatarImage src="/assets/avatar.png" alt="" *ngIf="false" />
          <span hlmAvatarFallback>{{ userInitials() }}</span>
        </hlm-avatar>
        <span class="text-sm font-light" *ngIf="user()?.name">{{ user()?.name }}</span>
        <hlm-spinner *ngIf="!user()?.name" data-icon="inline-start" class="w-4 h-4" />

        <ng-icon
          name="lucideChevronDown"
          class="text-[14px] text-(--primary-50) transition-transform duration-200 -rotate-90 group-aria-expanded:rotate-0"
        ></ng-icon>
      </button>

      <ng-template #menuProfile>
        <hlm-dropdown-menu class="w-43">
          <hlm-dropdown-menu-group>
            <button hlmDropdownMenuItem routerLink="/app/profile" class="cursor-pointer">
              <ng-icon name="lucideUser" />
              Perfil
            </button>
          </hlm-dropdown-menu-group>
          <hlm-dropdown-menu-separator />
          <hlm-dropdown-menu-group>
            <button hlmDropdownMenuItem (click)="logout()" class="cursor-pointer">
              <ng-icon name="lucideLogOut" />
              Sair
            </button>
          </hlm-dropdown-menu-group>
        </hlm-dropdown-menu>
      </ng-template>
    </div>
  </div>
</header>
