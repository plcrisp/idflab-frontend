<div class="h-full flex flex-col rounded-xl border border-(--border-subtle) bg-(--surface) p-4">
  <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary/10 mb-4 text-primary">
    <ng-icon name="{{ icon }}"></ng-icon>
  </div>

  <p class="text-sm text-muted-foreground mb-1">{{ label }}</p>

  <div class="flex items-baseline gap-1">
    <span class="text-3xl font-semibold text-(--text)">{{ value }}</span>
    <span *ngIf="unit" class="text-base font-medium text-muted-foreground">{{ unit }}</span>
  </div>

  @switch (footer?.type) { @case ('text') {
  <p class="text-xs text-muted-foreground mt-auto pt-2">{{ $any(footer).content }}</p>
  } @case ('progress') {
  <div class="mt-auto pt-2">
    <hlm-progress [value]="progressPercent">
      <hlm-progress-indicator />
    </hlm-progress>
  </div>
  } }
</div>
