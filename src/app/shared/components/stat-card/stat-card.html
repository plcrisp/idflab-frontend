<div
  class="h-full flex flex-col justify-between rounded-xl border border-border bg-popover p-3 transition-all"
  [class.opacity-50]="muted()"
  [class.grayscale-50]="muted()"
>
  <div class="flex items-center gap-2 mb-2">
    <div
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-primary/10 text-primary"
      [class.opacity-70]="muted()"
    >
      <ng-icon name="{{ icon() }}" size="18"></ng-icon>
    </div>
    <p class="text-sm font-medium text-muted-foreground">{{ label() }}</p>
  </div>

  @if (loading()) {
    <div class="flex flex-col gap-2 py-0.5">
      <div hlmSkeleton class="h-8 w-24 rounded-md"></div>
      <div hlmSkeleton class="h-3 w-32 mt-2 rounded-md"></div>
    </div>
  } @else {
    <div class="flex items-baseline gap-1">
      @if (value() != null) {
        <span class="text-2xl font-semibold text-foreground">{{ value() }}</span>
      } @else {
        <span class="text-2xl font-semibold text-muted-foreground/50">-</span>
      }
      @if (value() != null && unit()) {
        <span class="text-sm text-muted-foreground">{{ unit() }}</span>
      }
    </div>

    @switch (footer()?.type) {
      @case ('text') {
        <p class="text-xs text-muted-foreground mt-2 pt-2">
          {{ $any(footer()).content != null ? $any(footer()).content : '-' }}
        </p>
      }
      @case ('progress') {
        <div class="mt-2 pt-2">
          <hlm-progress [value]="progressPercent()" class="h-1">
            <hlm-progress-indicator />
          </hlm-progress>
        </div>
      }
    }
  }
</div>
