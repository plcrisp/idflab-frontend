<div class="relative">
  <button
    class="relative flex items-center justify-center w-9 h-9 rounded-md bg-transparent text-white transition-colors hover:bg-sidebar-accent cursor-pointer"
    aria-label="Notificações"
    [hlmDropdownMenuTrigger]="menuNotifications"
    (hlmDropdownMenuClosed)="onMenuClosed()"
    #bellTrigger
  >
    <ng-icon name="lucideBell" class="text-lg"></ng-icon>

    <span
      *ngIf="hasWorkingJobs()"
      class="absolute inset-0.75 rounded-full border-[1.5px] border-t-transparent border-(--color-primary-600) animate-spin"
    ></span>

    <span
      *ngIf="!hasWorkingJobs() && unreadCount() > 0"
      class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-(--color-error) ring-2 ring-(--color-primary-800)"
    ></span>
  </button>
  <ng-template #menuNotifications>
    <hlm-dropdown-menu class="w-90">
      <div class="flex items-center justify-between pl-2 pr-4">
        <hlm-dropdown-menu-label>Notificações</hlm-dropdown-menu-label>
        <span *ngIf="notifications().length > 0" class="text-xs text-(--color-grey-light)">
          {{ notifications().length }}
        </span>
      </div>
      <hlm-dropdown-menu-separator />

      <!-- Jobs ativos -->
      <div
        *ngIf="activeJobs().length > 0"
        class="px-5 pb-4 pt-4 bg-(--color-primary-700) border-l-2 border-(--color-primary-600)"
      >
        <div *ngFor="let job of activeJobs()" class="mb-3 last:mb-0">
          <div class="flex items-start gap-2 mb-2">
            <span
              class="w-3.5 h-3.5 mt-0.5 rounded-full border-2 border-(--color-primary-600) border-t-transparent animate-spin shrink-0"
            ></span>
            <span class="text-[13px] font-semibold text-white leading-snug truncate">
              {{ job.project_name }}
            </span>
            <span class="ml-auto text-sm font-semibold text-white shrink-0">
              {{ job.progress }}%
            </span>
          </div>

          <p class="text-[13px] text-(--color-grey-light) mb-2.5 leading-relaxed">
            {{ job.details?.message }}
          </p>

          <div class="h-1 bg-(--color-primary-800) rounded-full overflow-hidden">
            <div
              class="h-full bg-(--color-primary-600) rounded-full transition-all duration-300"
              [style.width.%]="job.progress"
            ></div>
          </div>
        </div>
      </div>

      <hlm-dropdown-menu-separator *ngIf="activeJobs().length > 0 && notifications().length > 0" />

      <!-- Notificações -->
      <div class="max-h-70 overflow-y-auto divide-y divide-(--color-primary-divider)">
        <div
          *ngFor="let notif of notifications(); trackBy: trackByNotifId"
          class="group flex gap-3 px-5 py-3.5 cursor-pointer transition-colors hover:bg-sidebar-accent relative"
          (click)="openProject(notif.project_id, notif.type)"
        >
          <ng-icon
            [name]="notif.type === 'FAILED' ? 'lucideCircleX' : 'lucideCircleCheck'"
            class="text-lg mt-0.5 shrink-0"
            [style.color]="notif.type === 'FAILED' ? 'var(--color-error)' : 'var(--color-success)'"
          ></ng-icon>

          <div class="flex-1 min-w-0 pr-8">
            <span
              class="text-[13.5px] font-semibold block mb-0.5"
              [class.text-(--color-white)]="notif.type !== 'FAILED'"
              [class.text-(--color-error)]="notif.type === 'FAILED'"
            >
              {{ notif.title }}
            </span>
            <p
              class="text-[12.5px] leading-relaxed"
              [class.text-(--color-grey-light)]="notif.type !== 'FAILED'"
              [class.text-(--color-error)]="notif.type === 'FAILED'"
            >
              {{ notif.message }}
            </p>
          </div>

          <button
            (pointerdown)="$event.stopPropagation()"
            (mousedown)="$event.stopPropagation()"
            (click)="deleteNotification(notif.id, $event)"
            class="absolute right-4 top-3.5 py-0.5 px-1.5 rounded-md text-(--sidebar-text-muted) opacity-0 transition-all hover:bg-sidebar-accent hover:text-white group-hover:opacity-100"
            title="Remover notificação"
          >
            <ng-icon name="lucideTrash2" class="text-sm"></ng-icon>
          </button>
        </div>

        <div *ngIf="notifications().length === 0 && activeJobs().length === 0" class="text-center">
          <div class="mx-3 flex flex-col items-center justify-center rounded-lg text-center pt-4">
            <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-primary/20">
              <ng-icon name="lucideBellOff" class="text-xl text-muted-foreground/40"></ng-icon>
            </div>
            <span class="mb-5 text-xs text-(--sidebar-text-muted)">
              Nenhuma notificação por aqui.
            </span>
          </div>
        </div>
      </div>
    </hlm-dropdown-menu>
  </ng-template>
</div>
