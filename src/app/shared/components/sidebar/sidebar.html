<aside class="sidebar" [class.collapsed]="mainLayoutService.isSidebarCollapsed()">
  <div class="logo-area">
    <a class="logo-wrapper" routerLink="/app/dashboard">
      <img src="assets/images/logos/IDFLab_white.png" alt="IDFLab" />
      <span class="logo-text">IDFLab</span>
    </a>

    <button class="toggle-btn" (click)="mainLayoutService.toggleSidebar()">
      <ng-icon
        [name]="mainLayoutService.isSidebarCollapsed() ? 'lucideChevronRight' : 'lucideChevronLeft'"
      ></ng-icon>
    </button>
  </div>

  <nav class="main-nav">
    <a routerLink="/app/dashboard" class="nav-item">
      <ng-icon name="lucideHome" class="nav-icon"></ng-icon>
      <span>Dashboard</span>
    </a>
    <a href="#" class="nav-item">
      <ng-icon name="lucideFolderOpen" class="nav-icon"></ng-icon>
      <span>Central de Projetos</span>
    </a>
  </nav>

  <div
    class="projects-section"
    [style.display]="mainLayoutService.isSidebarCollapsed() ? 'none' : 'block'"
  >
    <h3 class="section-title">PROJETOS RECENTES</h3>

    <div class="empty-projects-state">
      <div class="empty-icon-wrapper">
        <ng-icon name="lucideFolder" class="empty-icon"></ng-icon>
      </div>
      <span class="empty-text">Nenhum projeto salvo</span>
    </div>
  </div>

  <div class="sidebar-footer" *ngIf="!mainLayoutService.isSidebarCollapsed()">
    <p>IDFLab v1.0.0 &copy; 2026</p>
  </div>
</aside>
