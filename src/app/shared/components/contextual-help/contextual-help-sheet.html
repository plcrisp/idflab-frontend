<hlm-sheet
  [state]="isOpen() ? 'open' : 'closed'"
  (stateChanged)="onStateChanged($event)"
  side="right"
>
  <hlm-sheet-content
    *brnSheetContent="let ctx"
    [showCloseButton]="false"
    class="help-sheet-panel w-full max-sm:w-screen max-sm:max-w-none sm:max-w-lg md:max-w-lg h-full p-0 flex flex-col gap-0 border-l border-border bg-card transition-all duration-200"
  >
    <!-- 1. CABEÇALHO FIXO -->
    <header class="flex items-start justify-between px-5 pt-5 pb-4 border-b border-border bg-card shrink-0 z-20">
      <div class="flex flex-col min-w-0 pr-3">
        <h2 class="text-xl font-bold text-foreground tracking-tight leading-tight">
          Ajuda
        </h2>
        <p class="text-xs text-muted-foreground mt-0.5 truncate">
          @if (activeTab() === 'overview') {
            Visão geral do fluxo
          } @else {
            Etapa {{ viewingStepIndex() + 1 }} de 8 · {{ viewingStepContent().title }}
          }
        </p>
      </div>

      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        class="h-8 w-8 text-muted-foreground hover:text-foreground hover:bg-muted rounded-md cursor-pointer shrink-0 mt-0.5"
        (click)="helpService.close()"
        aria-label="Fechar painel de ajuda"
      >
        <ng-icon name="lucideX" class="text-lg" />
      </button>
    </header>

    <!-- 2. ABAS ("Esta etapa" e "Visão geral") -->
    <div class="px-5 border-b border-border bg-card shrink-0 z-10" role="tablist" aria-label="Navegação da ajuda">
      <div class="flex items-center gap-6 -mb-px">
        <button
          type="button"
          role="tab"
          id="tab-step"
          aria-controls="panel-step"
          [attr.aria-selected]="activeTab() === 'step'"
          (click)="onTabClick('step')"
          class="py-3 text-sm font-semibold border-b-2 cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
          [ngClass]="activeTab() === 'step' ? 'border-primary text-primary' : 'border-transparent text-muted-foreground hover:text-foreground'"
        >
          Esta etapa
        </button>

        <button
          type="button"
          role="tab"
          id="tab-overview"
          aria-controls="panel-overview"
          [attr.aria-selected]="activeTab() === 'overview'"
          (click)="onTabClick('overview')"
          class="py-3 text-sm font-semibold border-b-2 cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
          [ngClass]="activeTab() === 'overview' ? 'border-primary text-primary' : 'border-transparent text-muted-foreground hover:text-foreground'"
        >
          Visão geral
        </button>
      </div>
    </div>

    <!-- 3. CORPO ROLÁVEL -->
    <div
      #scrollContainer
      (scroll)="onBodyScroll()"
      data-slot="sheet-body"
      class="help-sheet-scroll flex-1 min-h-0 overflow-y-auto px-5 py-5 focus-visible:outline-none"
      tabindex="-1"
    >
      @if (activeTab() === 'step') {
        <div id="panel-step" role="tabpanel" aria-labelledby="tab-step">
          <app-help-step-tab [step]="viewingStepContent()" />
        </div>
      } @else {
        <div id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
          <app-help-overview-tab
            [currentStepIndex]="helpService.currentStepIndex()"
            [generalReferences]="helpService.generalReferences"
            (stepSelect)="onOverviewStepSelected($event)"
          />
        </div>
      }
    </div>

    <!-- 4. RODAPÉ FIXO (exibido apenas fora da "Visão geral", na aba "Esta etapa") -->
    @if (shouldShowFooter()) {
      <footer class="flex items-center justify-between px-5 py-3 border-t border-border bg-card shrink-0 z-20">
        <button
          hlmBtn
          variant="ghost"
          size="sm"
          type="button"
          class="text-xs font-medium text-foreground hover:bg-muted/60 cursor-pointer disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed"
          [disabled]="!helpService.hasPreviousStep()"
          (click)="helpService.goToPreviousStep()"
        >
          <ng-icon name="lucideArrowLeft" class="text-sm mr-1.5" />
          <span>Etapa anterior</span>
        </button>

        <!-- Mini-linha do tempo de progresso (8 etapas) -->
        <div
          class="flex items-center gap-1.5 px-2 select-none"
          role="progressbar"
          [attr.aria-valuenow]="viewingStepIndex() + 1"
          aria-valuemin="1"
          aria-valuemax="8"
          [attr.aria-label]="'Etapa ' + (viewingStepIndex() + 1) + ' de 8'"
        >
          @for (s of stepIndices; track s) {
            <span
              class="h-1.5 rounded-md transition-all duration-200"
              [class.w-4]="s === viewingStepIndex()"
              [class.w-2]="s !== viewingStepIndex()"
              [class.bg-primary]="s <= viewingStepIndex()"
              [class.opacity-70]="s < viewingStepIndex()"
              [class.bg-border]="s > viewingStepIndex()"
            ></span>
          }
        </div>

        <button
          hlmBtn
          variant="ghost"
          size="sm"
          type="button"
          class="text-xs font-medium text-foreground hover:bg-muted/60 cursor-pointer disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed"
          [disabled]="!helpService.hasNextStep()"
          (click)="helpService.goToNextStep()"
        >
          <span>Próxima etapa</span>
          <ng-icon name="lucideArrowRight" class="text-sm ml-1.5" />
        </button>
      </footer>
    }
  </hlm-sheet-content>
</hlm-sheet>
