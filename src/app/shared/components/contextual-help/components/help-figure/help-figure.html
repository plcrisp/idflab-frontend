<div
  class="w-full h-[120px] rounded-lg bg-muted/40 border border-border/50 flex items-center justify-center p-3 select-none overflow-hidden"
>
  <svg
    [attr.aria-label]="ariaLabel()"
    role="img"
    viewBox="0 0 280 100"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="w-full h-full max-w-[280px] max-h-[96px] text-primary"
  >
    @switch (figure()) {
      @case ('map') {
        <!-- Smooth contour lines -->
        <path
          d="M10 80 Q 70 30, 140 65 T 270 40"
          class="stroke-muted-foreground/30"
          stroke-width="1.5"
          fill="none"
        />
        <path
          d="M10 50 Q 90 20, 160 55 T 270 20"
          class="stroke-muted-foreground/30"
          stroke-width="1.5"
          fill="none"
        />
        <path
          d="M20 95 Q 100 60, 180 85 T 270 70"
          class="stroke-muted-foreground/20"
          stroke-width="1.5"
          fill="none"
        />
        <!-- Secondary station points -->
        <circle cx="50" cy="45" r="3.5" class="fill-muted-foreground/40" />
        <circle cx="110" cy="35" r="3.5" class="fill-muted-foreground/40" />
        <circle cx="210" cy="55" r="3.5" class="fill-muted-foreground/40" />
        <circle cx="240" cy="30" r="3.5" class="fill-muted-foreground/40" />
        <circle cx="95" cy="75" r="3.5" class="fill-muted-foreground/40" />
        <!-- Highlighted station with amber pin/ring -->
        <circle cx="150" cy="48" r="8" class="stroke-amber-500/30" stroke-width="2" />
        <circle cx="150" cy="48" r="5" class="fill-amber-500 stroke-background" stroke-width="1.5" />
      }

      @case ('initial-visualization') {
        <!-- Annual precipitation bars with peak in amber -->
        <rect x="25" y="55" width="10" height="35" rx="2" class="fill-primary/40" />
        <rect x="42" y="45" width="10" height="45" rx="2" class="fill-primary/40" />
        <rect x="59" y="60" width="10" height="30" rx="2" class="fill-primary/40" />
        <rect x="76" y="38" width="10" height="52" rx="2" class="fill-primary/40" />
        <rect x="93" y="48" width="10" height="42" rx="2" class="fill-primary/40" />
        <rect x="110" y="30" width="10" height="60" rx="2" class="fill-primary/40" />
        <!-- Peak bar in amber -->
        <rect x="127" y="15" width="10" height="75" rx="2" class="fill-amber-500" />
        <circle cx="132" cy="11" r="2.5" class="fill-amber-500" />

        <rect x="144" y="40" width="10" height="50" rx="2" class="fill-primary/40" />
        <rect x="161" y="52" width="10" height="38" rx="2" class="fill-primary/40" />
        <rect x="178" y="35" width="10" height="55" rx="2" class="fill-primary/40" />
        <rect x="195" y="62" width="10" height="28" rx="2" class="fill-primary/40" />
        <rect x="212" y="44" width="10" height="46" rx="2" class="fill-primary/40" />
        <rect x="229" y="50" width="10" height="40" rx="2" class="fill-primary/40" />
        <rect x="246" y="38" width="10" height="52" rx="2" class="fill-primary/40" />
        <!-- Base axis -->
        <line x1="15" y1="90" x2="265" y2="90" class="stroke-border" stroke-width="1.5" />
      }

      @case ('consistency-check') {
        <!-- Double-mass 45 degree dashed line and close curve -->
        <line x1="25" y1="90" x2="255" y2="90" class="stroke-border" stroke-width="1.5" />
        <line x1="25" y1="90" x2="25" y2="15" class="stroke-border" stroke-width="1.5" />
        <!-- 45 deg theoretical reference (dashed) -->
        <line
          x1="25"
          y1="90"
          x2="245"
          y2="20"
          class="stroke-muted-foreground/40"
          stroke-width="1.5"
          stroke-dasharray="4 4"
        />
        <!-- Actual double-mass curve -->
        <path
          d="M 25 90 Q 90 75, 140 54 T 245 20"
          class="stroke-primary"
          stroke-width="2"
          fill="none"
        />
        <!-- Inflection point test dot in amber -->
        <circle cx="140" cy="54" r="4.5" class="fill-amber-500 stroke-background" stroke-width="1.5" />
      }

      @case ('gap-treatment') {
        <!-- Continuous series with missing gaps and amber filled segments -->
        <line x1="20" y1="85" x2="260" y2="85" class="stroke-border" stroke-width="1.5" />
        <!-- Segment 1 (original) -->
        <path
          d="M 20 65 L 45 40 L 70 58 L 90 35"
          class="stroke-primary"
          stroke-width="2"
          fill="none"
        />
        <!-- Gap segment 1 (amber filled / imputed) -->
        <path
          d="M 90 35 L 115 50 L 135 30"
          class="stroke-amber-500"
          stroke-width="2"
          stroke-dasharray="3 3"
          fill="none"
        />
        <!-- Segment 2 (original) -->
        <path
          d="M 135 30 L 160 60 L 185 42 L 205 55"
          class="stroke-primary"
          stroke-width="2"
          fill="none"
        />
        <!-- Gap segment 2 (amber filled) -->
        <path
          d="M 205 55 L 225 38 L 245 45"
          class="stroke-amber-500"
          stroke-width="2"
          stroke-dasharray="3 3"
          fill="none"
        />
        <!-- Accent dots at boundary -->
        <circle cx="90" cy="35" r="3" class="fill-amber-500" />
        <circle cx="135" cy="30" r="3" class="fill-amber-500" />
        <circle cx="205" cy="55" r="3" class="fill-amber-500" />
      }

      @case ('temporal-resolution') {
        <!-- Intensity vs Duration decay curve -->
        <line x1="30" y1="85" x2="255" y2="85" class="stroke-border" stroke-width="1.5" />
        <line x1="30" y1="85" x2="30" y2="15" class="stroke-border" stroke-width="1.5" />
        <!-- Smooth hyperbolic decay curve -->
        <path
          d="M 35 22 Q 65 30, 110 58 T 245 80"
          class="stroke-primary"
          stroke-width="2.5"
          fill="none"
        />
        <!-- Sub-hourly duration marks -->
        <line x1="70" y1="83" x2="70" y2="87" class="stroke-muted-foreground" stroke-width="1" />
        <line x1="120" y1="83" x2="120" y2="87" class="stroke-muted-foreground" stroke-width="1" />
        <line x1="180" y1="83" x2="180" y2="87" class="stroke-muted-foreground" stroke-width="1" />
        <!-- Key disaggregation point in amber -->
        <circle cx="70" cy="36" r="4" class="fill-amber-500 stroke-background" stroke-width="1.5" />
      }

      @case ('statistical-distribution') {
        <!-- Histogram bars -->
        <rect x="40" y="70" width="16" height="20" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="60" y="52" width="16" height="38" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="80" y="38" width="16" height="52" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="100" y="30" width="16" height="60" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="120" y="42" width="16" height="48" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="140" y="58" width="16" height="32" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="160" y="72" width="16" height="18" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <rect x="180" y="78" width="16" height="12" rx="1" class="fill-primary/20 stroke-primary/30" stroke-width="1" />
        <line x1="30" y1="90" x2="250" y2="90" class="stroke-border" stroke-width="1.5" />
        <!-- Candidate distribution curves (Gumbel in amber, others subtle) -->
        <path
          d="M 35 88 Q 80 82, 108 28 Q 135 60, 240 88"
          class="stroke-muted-foreground/40"
          stroke-width="1.5"
          fill="none"
        />
        <path
          d="M 35 88 Q 75 75, 108 25 Q 145 68, 240 88"
          class="stroke-amber-500"
          stroke-width="2.5"
          fill="none"
        />
        <circle cx="108" cy="25" r="3.5" class="fill-amber-500" />
      }

      @case ('historical-idf') {
        <!-- Family of IDF curves for different return periods (TR 2 to 100) -->
        <line x1="30" y1="88" x2="255" y2="88" class="stroke-border" stroke-width="1.5" />
        <line x1="30" y1="88" x2="30" y2="15" class="stroke-border" stroke-width="1.5" />
        <!-- TR = 2 -->
        <path d="M 35 68 Q 90 74, 245 84" class="stroke-primary/40" stroke-width="1.5" fill="none" />
        <!-- TR = 10 -->
        <path d="M 35 52 Q 90 60, 245 76" class="stroke-primary/60" stroke-width="1.5" fill="none" />
        <!-- TR = 25 -->
        <path d="M 35 38 Q 90 48, 245 68" class="stroke-primary/80" stroke-width="1.5" fill="none" />
        <!-- TR = 100 (top curve in amber) -->
        <path d="M 35 22 Q 90 32, 245 58" class="stroke-amber-500" stroke-width="2" fill="none" />
        <circle cx="245" cy="58" r="3" class="fill-amber-500" />
      }

      @case ('future-scenarios') {
        <!-- Historical solid curve + future amber dashed curve above -->
        <line x1="30" y1="88" x2="255" y2="88" class="stroke-border" stroke-width="1.5" />
        <line x1="30" y1="88" x2="30" y2="15" class="stroke-border" stroke-width="1.5" />
        <!-- Historical baseline (solid) -->
        <path
          d="M 35 48 Q 95 56, 245 74"
          class="stroke-primary"
          stroke-width="2"
          fill="none"
        />
        <!-- Climate scenario projection (amber, dashed, higher intensity) -->
        <path
          d="M 35 24 Q 95 35, 245 54"
          class="stroke-amber-500"
          stroke-width="2"
          stroke-dasharray="4 3"
          fill="none"
        />
        <!-- Increase indicator arrow/dots -->
        <circle cx="150" cy="62" r="2.5" class="fill-primary" />
        <circle cx="150" cy="42" r="3" class="fill-amber-500" />
        <line
          x1="150"
          y1="58"
          x2="150"
          y2="46"
          class="stroke-amber-500"
          stroke-width="1.5"
        />
      }
    }
  </svg>
</div>
