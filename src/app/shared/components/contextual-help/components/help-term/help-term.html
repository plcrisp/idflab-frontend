<hlm-popover align="end" [sideOffset]="6">
  <button
    hlmPopoverTrigger
    type="button"
    class="inline font-medium text-foreground underline decoration-dotted decoration-foreground/60 underline-offset-4 cursor-pointer hover:text-primary hover:decoration-primary focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring rounded-sm transition-colors text-inherit"
    [attr.aria-label]="'Definição de ' + term()"
  >
    {{ term() }}
  </button>

  <div
    *hlmPopoverPortal
    hlmPopoverContent
    class="w-72 max-w-[calc(100vw-32px)] p-3 rounded-lg border border-border bg-popover text-popover-foreground shadow-lg text-xs z-50"
  >
    <span class="block font-semibold text-foreground text-[13px] mb-1">
      {{ term() }}
    </span>
    <p class="text-muted-foreground leading-relaxed text-xs text-pretty">
      {{ definition() }}
    </p>
  </div>
</hlm-popover>
