<div class="differentiators-root select-none">
  <div class="differentiators-title">{{ header }}</div>

  <div class="differentiators-grid">
    @for (item of items(); track item.id) {
      <div class="diff-item">
        <ng-icon
          [name]="item.icon"
          class="diff-icon"
          [class.future-icon]="item.isFuture"
        ></ng-icon>

        <div class="diff-text">
          <span class="diff-heading">{{ item.title }}</span>
          <span class="diff-desc">{{ item.description }}</span>
        </div>
      </div>
    }
  </div>

  <div class="reproducibility-divider"></div>

  <p class="reproducibility-footer">
    {{ note }}
  </p>
</div>
