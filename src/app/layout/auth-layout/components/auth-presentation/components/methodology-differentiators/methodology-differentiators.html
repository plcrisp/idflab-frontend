<div class="differentiators-row select-none" role="region" aria-label="Diferenciais do IDFLab">
  @for (item of items; track item.id) {
    <div class="diff-card">
      <div class="diff-icon-box">
        <ng-icon [name]="item.icon" class="diff-icon" aria-hidden="true"></ng-icon>
      </div>
      <span class="diff-label">{{ item.label }}</span>
    </div>
  }
</div>
