<div class="grid grid-cols-3 gap-2.5 xl:gap-3.5 w-full select-none" role="region" aria-label="Diferenciais do IDFLab">
  @for (item of items; track item.id) {
    <div class="flex items-center gap-2 xl:gap-2.5 min-w-0 h-12 px-2.5 xl:px-3.5 rounded-lg border border-white/10 bg-white/5 backdrop-blur-md hover:bg-white/10 hover:border-white/20 transition-colors">
      <div class="flex items-center justify-center w-6 h-6 xl:w-7 xl:h-7 rounded-md bg-[#5b6f9a]/25 shrink-0">
        <ng-icon [name]="item.icon" class="text-sm xl:text-base text-slate-300" aria-hidden="true"></ng-icon>
      </div>
      <span class="text-[13px] xl:text-sm font-medium text-white leading-none tracking-tight truncate">
        {{ item.label }}
      </span>
    </div>
  }
</div>
