<div class="flex flex-col w-full relative select-none">
  <div class="relative w-full h-[clamp(310px,40vh,410px)] max-h-[800px]:h-[clamp(240px,34vh,310px)] flex mt-0">
    <div
      class="annotation-flag absolute h-[var(--flag-height,84px)] max-h-[800px]:h-[76px] flex flex-col justify-start z-10 pointer-events-none"
      [style.left.%]="peakXPercent"
      [style.bottom.%]="flagBottomPercent"
    >
      <div class="flag-pole"></div>
      <div class="flag-content flex flex-col gap-1 pl-3 whitespace-nowrap">
        <div class="flex items-baseline">
          <span class="text-[clamp(32px,2.6vw,40px)] max-h-[800px]:text-[clamp(28px,2.2vw,34px)] font-bold leading-none tracking-[-0.035em] text-white [font-feature-settings:'tnum'_on,'lnum'_on] m-0">
            {{ displayNumber() }}
          </span>
        </div>
        <div class="text-[12px] font-semibold tracking-[0.03em] uppercase leading-none text-[#f5a623] whitespace-nowrap m-0 p-0">
          {{ peakRecord.headline }}
        </div>
      </div>
    </div>

    <svg
      viewBox="0 0 1000 350"
      preserveAspectRatio="none"
      class="w-full h-full block overflow-visible"
      shape-rendering="crispEdges"
      role="region"
      aria-label="Gráfico de precipitação diária máxima anual: 1961 a 2100"
    >
      <line
        class="dashed-reference-line"
        [attr.x1]="peakCenterX"
        [attr.y1]="peakLevelY"
        [attr.x2]="viewWidth"
        [attr.y2]="peakLevelY"
      />

      <circle
        class="peak-marker-dot"
        [attr.cx]="peakCenterX"
        [attr.cy]="peakLevelY"
        r="3"
        shape-rendering="geometricPrecision"
      />

      @for (bar of historicalBars(); track bar.year) {
        @if (bar.isPeak) {
          <rect
            class="bar-peak"
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            rx="1.5"
            [hlmTooltip]="peakRecord.valueFormatted + ' · Recorde histórico em ' + bar.year"
            tabindex="0"
            [attr.aria-label]="bar.year + ': ' + peakRecord.valueFormatted + ' (Recorde Histórico)'"
          />
        } @else {
          <rect
            class="bar-historical"
            [style.--i]="bar.index"
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            rx="1.5"
            [hlmTooltip]="bar.year + ': ' + bar.valueFormatted"
            tabindex="0"
            [attr.aria-label]="bar.year + ': ' + bar.valueFormatted"
          />
        }
      }

      <line
        class="divider-line"
        [attr.x1]="dividerX"
        [attr.y1]="dividerStartY"
        [attr.x2]="dividerX"
        [attr.y2]="baseY"
      />

      @for (bar of futureBars(); track bar.year) {
        <rect
          class="bar-future"
          [class.bar-above-record]="bar.isAboveRecord"
          [style.--future-i]="bar.index"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          rx="1.5"
          [hlmTooltip]="bar.year + ' (CMIP6): ' + bar.valueFormatted"
          tabindex="0"
          [attr.aria-label]="bar.year + ' Projeção CMIP6: ' + bar.valueFormatted"
        />
      }

      <line
        class="chart-baseline"
        x1="0"
        [attr.y1]="baseY"
        [attr.x2]="viewWidth"
        [attr.y2]="baseY"
      />
    </svg>

    <span class="cmip6-badge absolute top-[calc(32.29%-var(--flag-height,84px))] max-h-[800px]:top-[calc(32.29%-76px)] left-[calc(47.2%+12px)] text-xs font-bold tracking-wider uppercase text-[#f5a623] bg-[#f5a623]/10 border border-[#f5a623]/25 rounded px-2.5 py-1 pointer-events-none whitespace-nowrap leading-none">
      PROJEÇÃO CMIP6
    </span>
  </div>

  <div class="relative w-full h-[18px] mt-2.5 text-xs leading-none [font-feature-settings:'tnum'_on] select-none" aria-hidden="true">
    <span
      class="absolute -translate-x-1/2 text-[#f5a623] font-bold tracking-wide"
      [style.left.%]="peakXPercent"
    >
      {{ peakRecord.year }}
    </span>
    <span
      class="absolute text-white/70 font-medium tracking-wide"
      [style.right.%]="lastBarRightPercent"
    >
      2100
    </span>
  </div>
</div>
