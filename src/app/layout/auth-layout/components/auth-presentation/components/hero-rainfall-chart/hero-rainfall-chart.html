<div class="hero-chart-wrapper select-none">
  <div class="svg-container">
    <div
      class="annotation-flag"
      [style.left.%]="peakXPercent"
      [style.bottom.%]="flagBottomPercent"
    >
      <div class="flag-pole"></div>
      <div class="flag-content">
        <div class="annotation-number-row">
          <span class="annotation-number">{{ displayNumber() }}</span>
        </div>
        <div class="annotation-meta-amber">
          {{ peakRecord.headline }}
        </div>
      </div>
    </div>

    <svg
      viewBox="0 0 1000 350"
      preserveAspectRatio="none"
      class="chart-svg"
      shape-rendering="crispEdges"
      role="region"
      aria-label="Gráfico de precipitação diária máxima anual: 1961 a 2100"
    >
      <line
        class="dashed-reference-line"
        [attr.x1]="peakCenterX"
        [attr.y1]="peakLevelY"
        [attr.x2]="viewWidth"
        [attr.y2]="peakLevelY"
      />

      <circle
        class="peak-marker-dot"
        [attr.cx]="peakCenterX"
        [attr.cy]="peakLevelY"
        r="3"
        shape-rendering="geometricPrecision"
      />

      @for (bar of historicalBars(); track bar.year) {
        @if (bar.isPeak) {
          <rect
            class="bar-peak"
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            rx="1.5"
            tabindex="0"
            role="graphics-symbol"
            [attr.aria-label]="bar.tooltipText"
            [hlmTooltip]="bar.tooltipText"
            position="top"
          />
        } @else {
          <rect
            class="bar-historical"
            [style.--i]="bar.index"
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            rx="1.5"
            tabindex="0"
            role="graphics-symbol"
            [attr.aria-label]="bar.tooltipText"
            [hlmTooltip]="bar.tooltipText"
            position="top"
          />
        }
      }

      <line
        class="divider-line"
        [attr.x1]="dividerX"
        [attr.y1]="dividerStartY"
        [attr.x2]="dividerX"
        [attr.y2]="baseY"
      />

      @for (bar of futureBars(); track bar.year) {
        <rect
          class="bar-future"
          [class.bar-above-record]="bar.isAboveRecord"
          [style.--future-i]="bar.index"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          rx="1.5"
          tabindex="0"
          role="graphics-symbol"
          [attr.aria-label]="bar.tooltipText"
          [hlmTooltip]="bar.tooltipText"
          position="top"
        />
      }

      <line
        class="chart-baseline"
        x1="0"
        [attr.y1]="baseY"
        [attr.x2]="viewWidth"
        [attr.y2]="baseY"
      />
    </svg>

    <div
      class="cmip6-badge"
      [style.left]="'calc(' + dividerXPercent + '% + 12px)'"
    >
      PROJEÇÃO CMIP6
    </div>
  </div>

  <div class="x-axis-row">
    <span class="x-label x-label-peak" [style.left.%]="peakXPercent">1988</span>
    <span class="x-label x-label-end" [style.right.%]="lastBarRightPercent">2100</span>
  </div>
</div>
