<section class="auth-presentation-wrapper" aria-label="Apresentação do IDFLab">
  <header class="brand-header select-none">
    <img src="assets/images/logos/IDFLab_white.png" alt="IDFLab" class="brand-icon" />
    <span class="brand-name">{{ texts.brand }}</span>
  </header>

  <div class="narrative-block select-none">
    <h1 class="narrative-title">
      Da série bruta à curva IDF,<br />com método à vista.
    </h1>
    <p class="narrative-subtitle">
      {{ texts.subtitle }}
    </p>
  </div>

  <div class="chart-flex-block">
    <app-hero-rainfall-chart></app-hero-rainfall-chart>
  </div>

  <div class="differentiators-block">
    <app-methodology-differentiators></app-methodology-differentiators>
  </div>

  <footer class="presentation-footer select-none">
    <span class="footer-text">{{ texts.footer }}</span>
  </footer>
</section>
